# `mprocs` starts the infrastructure and all three applications, one tab each.
# Ports: Storefront 3000, CMS 3001, Backend 8080. Each repository sets its own port; the
# Storefront reaches the Backend through its same-origin proxy (API_ORIGIN in its .env.local).
# `mise exec` makes every app use its own repository's Node version.

procs:
  infra:
    shell: docker compose up
    stop: SIGTERM

  backend:
    cwd: be-demo
    shell: mise exec -- npm run start:dev
    env:
      # Origin used for CORS and for links in emails; matches NEXT_PUBLIC_APP_URL of the Storefront.
      FRONTEND_URL: http://127.0.0.1:3000
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      # Mailpit accepts any login; the Backend only sends mail when all four SMTP values are set.
      SMTP_USER: local
      SMTP_PASS: local

  cms:
    cwd: cms
    shell: mise exec -- npm run dev

  storefront:
    cwd: fe-ecommerce-nike-style
    shell: mise exec -- pnpm dev
